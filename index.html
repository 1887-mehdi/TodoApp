<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارهای من</title>

    <link rel="preload" href="css/font/fonts/webfonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="page-loader" id="pageLoader" role="status" aria-live="polite" aria-label="در حال بارگذاری">
        <div class="loader"></div>
    </div>
    <main class="app">
        <div class="app-card">

            <!-- ========== Header ========== -->
            <div class="app-header">
                <div class="header-top">
                    <div class="brand">
                        <span class="brand__icon" data-icon="list-check" data-size="24"></span>
                        <div>
                            <h1 class="brand__title">کارهای من</h1>
                            <p class="brand__subtitle">امروز چه کارهایی داری؟</p>
                        </div>
                    </div>

                    <button type="button" class="theme-toggle" id="themeToggle" aria-label="تغییر تم">
                        <span class="theme-toggle__moon" data-icon="moon"></span>
                        <span class="theme-toggle__sun" data-icon="sun"></span>
                    </button>
                </div>

                <div class="todo-progress">
                    <div class="progress__info">
                        <span class="progress__label">پیشرفت امروز</span>
                        <span class="progress__percent" id="percent">۰٪</span>
                    </div>
                    <div class="progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
                        <div class="progress__bar" id="progressBar"></div>
                    </div>
                </div>
            </div>

            <!-- ========== Body ========== -->
            <div class="app-body">

                <form class="add-form" id="addForm" autocomplete="off">
                    <button type="button" class="add-form__mode" id="modeBtn"
                            aria-label="جستجو در تسک‌ها" title="جستجو در تسک‌ها" aria-pressed="false">
                        <span class="mode-icon mode-icon--search" data-icon="search" data-size="20"></span>
                        <span class="mode-icon mode-icon--close" data-icon="x" data-size="20"></span>
                    </button>

                    <input class="control add-form__input" id="todoInput" type="text"
                        placeholder="یک تسک جدید بنویس..." maxlength="100" autocomplete="off">

                    <div class="add-form__extras" id="addExtras">
                        <select class="control add-form__select" id="prioritySelect" aria-label="اولویت">
                            <option value="low">اولویت کم</option>
                            <option value="medium" selected>اولویت متوسط</option>
                            <option value="high">اولویت بالا</option>
                        </select>

                        <div class="date-field" id="dateField">
                            <button type="button" class="date-field__btn" id="dateBtn"
                                    aria-label="تاریخ سررسید" title="تاریخ سررسید">
                                <span data-icon="calendar" data-size="22"></span>
                                <span class="date-field__text" id="dateText"></span>
                            </button>
                            <button type="button" class="date-field__clear" id="dateClear"
                                    aria-label="حذف تاریخ" title="حذف تاریخ" hidden>
                                <span data-icon="x" data-size="14"></span>
                            </button>
                            <input id="dueInput" type="hidden">
                        </div>

                        <button type="submit" class="app-btn app-btn--primary add-form__btn" id="addBtn"
                                aria-label="افزودن تسک" title="افزودن تسک" disabled>
                            <span data-icon="plus" data-size="26"></span>
                        </button>
                    </div>
                </form>

                <nav class="filters">
                    <button type="button" class="filter-btn" data-filter="all">همه</button>
                    <button type="button" class="filter-btn" data-filter="active">انجام نشده</button>
                    <button type="button" class="filter-btn" data-filter="done">انجام شده</button>
                </nav>

                <div class="list-area">
                    <ul class="todo-list" id="todoList"></ul>

                    <div class="empty" id="emptyState" hidden>
                        <span class="empty__icon" id="emptyIcon"></span>
                        <p class="empty__title" id="emptyTitle"></p>
                        <p class="empty__text" id="emptyText"></p>
                    </div>
                </div>
            </div>

            <!-- ========== Footer ========== -->
            <div class="app-footer">
                <span class="counter" id="counter"></span>
                <button type="button" class="app-btn app-btn--ghost-danger app-btn--sm" id="clearBtn">
                    <span data-icon="trash" data-size="18"></span>
                    <span>پاک کردن همه</span>
                </button>
            </div>

        </div>
    </main>

    <!-- ========== Edit Modal(Bootstrap) ========== -->
    <div class="modal fade edit-modal" id="editModal" tabindex="-1" aria-labelledby="editModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="editForm" novalidate>

                <div class="modal-header">
                    <div class="d-flex align-items-center gap-3">
                        <span class="edit-modal__icon"><i class="bi bi-pencil-square"></i></span>
                        <div>
                            <h2 class="modal-title" id="editModalTitle">ویرایش تسک</h2>
                            <p class="edit-modal__sub mb-0">تغییرات رو اعمال کن و ذخیره بزن</p>
                        </div>
                    </div>
                    <button type="button" class="btn-close" id="editClose" data-bs-dismiss="modal" aria-label="بستن"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="editTitle">عنوان</label>
                        <input class="form-control" id="editTitle" type="text" maxlength="100" autocomplete="off">
                        <div class="invalid-feedback" id="editError"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="editDescription">توضیحات</label>
                        <textarea class="form-control" id="editDescription" rows="4" maxlength="300"
                                placeholder="توضیحات اختیاری..."></textarea>
                        <div class="form-text text-end" id="editCounter">۰ / ۳۰۰</div>
                    </div>

                    <div>
                        <label class="form-label" for="editPriority">اولویت</label>
                        <select class="form-select" id="editPriority">
                            <option value="low">کم</option>
                            <option value="medium">متوسط</option>
                            <option value="high">بالا</option>
                        </select>
                    </div>
                    <div class="mt-3">
                        <label class="form-label" for="editDueBtn">تاریخ سررسید</label>
                        <input id="editDue" type="hidden">
                        <button type="button" class="edit-date-btn" id="editDueBtn">
                            <span class="edit-date-btn__icon"><i class="bi bi-calendar3"></i></span>
                            <span id="editDueText" class="edit-date-btn__text">انتخاب تاریخ</span>
                            <span class="edit-date-btn__clear" id="editDueClear" role="button" aria-label="حذف تاریخ" hidden>
                                <i class="bi bi-x-lg"></i>
                            </span>
                        </button>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" id="editCancel" data-bs-dismiss="modal">انصراف</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i>
                        <span>ذخیره تغییرات</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- ========== Confirmation Modal ========== -->
    <dialog class="app-dialog app-dialog--sm" id="confirmModal" aria-labelledby="confirmTitle">
        <div class="app-dialog__header">
            <h2 class="app-dialog__title" id="confirmTitle"></h2>
            <button type="button" class="icon-btn" id="confirmClose" aria-label="بستن" data-icon="x"></button>
        </div>
        <div class="app-dialog__body">
            <p id="confirmMessage"></p>
        </div>
        <div class="app-dialog__footer">
            <button type="button" class="app-btn app-btn--secondary" id="confirmCancel">انصراف</button>
            <button type="button" class="app-btn app-btn--danger" id="confirmOk">تأیید</button>
        </div>
    </dialog>

    <!-- Messages -->
    <div class="toasts" id="toasts" aria-live="polite"></div>


    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
